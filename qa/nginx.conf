# Imita a CloudFront en local: /api/* va a la API y el resto son los archivos de frontend/.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}